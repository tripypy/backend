openapi: 3.0.0
info:
  title: JJTrip Trip Domain API
  version: 1.0.0
  description: 여행 계획 관련 API 명세

servers:
  - url: http://localhost:8080
    description: Local Development Server

security:
  - bearerAuth: []

paths:
  /trips:
    post:
      summary: 여행 생성
      operationId: createTrip
      tags:
        - Trip
      security:
        - bearerAuth: []
      responses:
        '201':
          description: 여행이 성공적으로 생성됨
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: 생성된 여행의 URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponseDto'
        '401':
          description: 인증 실패
    get:
      summary: 내 여행 목록 조회
      operationId: getMyTrips
      tags:
        - Trip
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TripStatus'
          required: false
          description: 여행 상태별 필터링 (DRAFT, PLANNED, COMPLETED)
      responses:
        '200':
          description: 내 여행 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripResponseDto'
        '401':
          description: 인증 실패

  /trips/summary:
    get:
      summary: 내 여행 요약 목록 조회 (카드용)
      operationId: getMyTripSummaries
      tags:
        - Trip
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 내 여행 요약 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummaryResponseDto'
        '401':
          description: 인증 실패

  /trips/{tripId}:
    get:
      summary: 여행 상세 조회
      operationId: getTripDetail
      tags:
        - Trip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tripId
          schema:
            type: integer
            format: int64
          required: true
          description: 조회할 여행의 ID
      responses:
        '200':
          description: 여행 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponseDto'
        '401':
          description: 인증 실패
        '403':
          description: 접근 권한 없음 (비공개 여행에 대한 타인 접근)
        '404':
          description: 여행을 찾을 수 없음
    put:
      summary: 여행 정보 수정
      operationId: updateTrip
      tags:
        - Trip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tripId
          schema:
            type: integer
            format: int64
          required: true
          description: 수정할 여행의 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdateRequestDto'
      responses:
        '200':
          description: 여행 정보 수정 성공
        '400':
          description: 잘못된 요청 (유효성 검사 실패)
        '401':
          description: 인증 실패
        '403':
          description: 접근 권한 없음 (여행 소유자가 아님)
        '404':
          description: 여행을 찾을 수 없음
    delete:
      summary: 여행 삭제
      operationId: deleteTrip
      tags:
        - Trip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tripId
          schema:
            type: integer
            format: int64
          required: true
          description: 삭제할 여행의 ID
      responses:
        '204':
          description: 여행 삭제 성공 (No Content)
        '401':
          description: 인증 실패
        '403':
          description: 접근 권한 없음 (여행 소유자가 아님)
        '404':
          description: 여행을 찾을 수 없음

  /trips/{tripId}/items:
    put:
      summary: 여행 아이템 전체 수정
      operationId: updateAllTripItems
      tags:
        - Trip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tripId
          schema:
            type: integer
            format: int64
          required: true
          description: 아이템을 수정할 여행의 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripItemsUpdateRequestDto'
      responses:
        '200':
          description: 여행 아이템 전체 수정 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripItemResponseDto'
        '400':
          description: 잘못된 요청 (유효성 검사 실패)
        '401':
          description: 인증 실패
        '403':
          description: 접근 권한 없음 (여행 소유자가 아님)
        '404':
          description: 여행을 찾을 수 없음

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TripStatus:
      type: string
      enum: [DRAFT, PLANNED, COMPLETED]
      description: 여행 상태 (DRAFT: 작성 중, PLANNED: 계획 완료, COMPLETED: 여행 완료)
    TripVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
      description: 여행 공개 여부 (PRIVATE: 비공개, PUBLIC: 공개)

    TripResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 여행 ID
        title:
          type: string
          description: 여행 제목
        startDate:
          type: string
          format: date
          nullable: true
          description: 여행 시작일
        endDate:
          type: string
          format: date
          nullable: true
          description: 여행 종료일
        status:
          $ref: '#/components/schemas/TripStatus'
          description: 여행 상태 (DRAFT, PLANNED, COMPLETED)
        visibility:
          $ref: '#/components/schemas/TripVisibility'
          description: 여행 공개 여부 (PUBLIC, PRIVATE)
        isOwner:
          type: boolean
          description: 현재 사용자가 여행의 소유자인지 여부
        # --- TripCard에서 필요한 추가 필드 ---
        spots:
          type: integer
          description: 여행에 포함된 장소(코스)의 총 개수
          minimum: 0 # 최소값 추가 (선택 사항)
        tags:
          type: array
          items:
            type: string
          nullable: true
          description: 여행에 적용된 태그 목록
        spotPreviews:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: 미리보기 장소의 이름
            required:
              - name
          description: 여행 코스 미리보기 (주요 장소 몇 개, 예: 최대 3개)
        completedDate:
          type: string
          format: date
          nullable: true
          description: 여행 완료일 (status가 COMPLETED일 경우)
      required:
        - id
        - title
        - status
        - visibility
        - isOwner
        - spots # 필수 필드로 추가
        - spotPreviews # 필수 필드로 추가

    TripSummaryResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 여행 ID
        title:
          type: string
          description: 여행 제목
        startDate:
          type: string
          format: date
          description: 여행 시작일
        endDate:
          type: string
          format: date
          description: 여행 종료일
        status:
          $ref: '#/components/schemas/TripStatus'
        visibility:
          $ref: '#/components/schemas/TripVisibility'
        day1Items:
          type: array
          items:
            $ref: '#/components/schemas/TripItemResponseDto'
          description: 첫째 날 여행 아이템 목록
      required:
        - id
        - title
        - status
        - visibility
        - day1Items

    TripDetailResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 여행 ID
        title:
          type: string
          description: 여행 제목
        startDate:
          type: string
          format: date
          description: 여행 시작일
        endDate:
          type: string
          format: date
          description: 여행 종료일
        status:
          $ref: '#/components/schemas/TripStatus'
        visibility:
          $ref: '#/components/schemas/TripVisibility'
        tripItems:
          type: array
          items:
            $ref: '#/components/schemas/TripItemResponseDto'
      required:
        - id
        - title
        - status
        - visibility
        - tripItems

    TripUpdateRequestDto:
      type: object
      properties:
        title:
          type: string
          description: 여행 제목
          minLength: 1
        startDate:
          type: string
          format: date
          description: 여행 시작일
        endDate:
          type: string
          format: date
          description: 여행 종료일
        status:
          $ref: '#/components/schemas/TripStatus'
        visibility:
          $ref: '#/components/schemas/TripVisibility'
      required:
        - title
        - status
        - visibility

    TripItemsUpdateRequestDto:
      type: object
      properties:
        days:
          type: array
          description: 일차별 여행 아이템 목록
          items:
            $ref: '#/components/schemas/TripItemsUpdateRequestDto_Day'
      required:
        - days
    TripItemsUpdateRequestDto_Day:
      type: object
      properties:
        dayNumber:
          type: integer
          description: 일차 (예: 1, 2, 3)
        items:
          type: array
          description: 해당 일차의 여행 아이템 목록
          items:
            $ref: '#/components/schemas/TripItemsUpdateRequestDto_ItemSync'
      required:
        - dayNumber
        - items
    TripItemsUpdateRequestDto_ItemSync:
      type: object
      properties:
        tripItemId:
          type: integer
          format: int64
          nullable: true
          description: 기존 여행 아이템 ID (새로운 아이템인 경우 null)
        spot:
          $ref: '#/components/schemas/SpotRequestDto'
          description: 장소 정보 (새로운 아이템인 경우 필수)
        memo:
          type: string
          nullable: true
          description: 아이템에 대한 메모
      required:
        - spot # spot은 새로운 아이템일 경우 필수, 기존 아이템 업데이트 시에는 변경되지 않을 수 있음. API 명세에 따라 필수 처리.

    TripItemResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 여행 아이템 ID
        dayNumber:
          type: integer
          description: 일차 (예: 1, 2, 3)
        orderIndex:
          type: integer
          description: 해당 일차 내 방문 순서
        memo:
          type: string
          nullable: true
          description: 아이템에 대한 메모
        spot:
          $ref: '#/components/schemas/SpotResponseDto'
      required:
        - id
        - dayNumber
        - orderIndex
        - spot

    SpotRequestDto:
      type: object
      properties:
        kakaoPlaceId:
          type: string
          description: 카카오 장소 ID
          minLength: 1
        name:
          type: string
          description: 장소 이름
          minLength: 1
        address:
          type: string
          nullable: true
          description: 장소 주소
        category:
          type: string
          nullable: true
          description: 장소 카테고리
        lat:
          type: number
          format: double
          description: 위도
        lng:
          type: number
          format: double
          description: 경도
        placeUrl:
          type: string
          nullable: true
          description: 장소 URL
        thumbnailUrl:
          type: string
          nullable: true
          description: 썸네일 이미지 URL
      required:
        - kakaoPlaceId
        - name
        - lat
        - lng

    SpotResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 장소 ID
        kakaoPlaceId:
          type: string
          description: 카카오 장소 ID
        name:
          type: string
          description: 장소 이름
        address:
          type: string
          nullable: true
          description: 장소 주소
        category:
          type: string
          nullable: true
          description: 장소 카테고리
        lat:
          type: number
          format: double
          description: 위도
        lng:
          type: number
          format: double
          description: 경도
        placeUrl:
          type: string
          nullable: true
          description: 장소 URL
        thumbnailUrl:
          type: string
          nullable: true
          description: 썸네일 이미지 URL
      required:
        - id
        - kakaoPlaceId
        - name
        - lat
        - lng
